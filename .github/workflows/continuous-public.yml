name: continuous-public

permissions: read-all

on: [push, workflow_dispatch]

jobs:

  ze_raytracing-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build
          cd build
          cmake -G Ninja -D CMAKE_CXX_COMPILER=g++ -D CMAKE_C_COMPILER=gcc -D CMAKE_BUILD_TYPE=Release -D CMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          cmake --build . --target package

  ze_raytracing-windows-latest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A "x64" -D CMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          cmake --build . --config Release --target package
